name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: |
          python3 --version
          for d in */tests; do
            python3 -m unittest discover -s "$d" -t "$d" -v
          done
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck */scripts/*.sh
