name: Bug report
description: A script failed, was refused, or the console editor showed something wrong
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options: [lv1-session, wing-snapshot, dm7-session]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Console / editor version (LV1, WING-Edit, DM Editor), firmware, OS, Python
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and full output
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What the editor or console showed, and what you expected
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please don't attach show files unless you're happy for them to be public; they hold your names, patching and device names.
